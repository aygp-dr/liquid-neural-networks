name: Liquid Neural Networks CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: pip install uv
        
    - name: Install dependencies
      run: |
        uv pip install numpy scipy matplotlib pytest black ruff
        # Skip heavy ML dependencies for CI
        
    - name: Lint with ruff
      run: |
        ruff check src/ || echo "Ruff issues found"
        
    - name: Format check with black
      run: |
        black --check src/ || echo "Black formatting issues"
        
    - name: Test Python implementation
      run: |
        make run-python
        
    - name: Run Python tests
      run: |
        make test-python

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-
      - run: bb check

  smoke-test:
    runs-on: ubuntu-latest
    needs: [test-python, check]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Install Clojure CLI
      uses: DeLaGuardo/setup-clojure@12.1
      with:
        cli: latest
        
    - name: Install uv and basic dependencies
      run: |
        pip install uv
        uv pip install numpy scipy matplotlib
        
    - name: Run smoke tests
      run: |
        make smoke-test
